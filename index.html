<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Candidate Verification System </title>

    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .container-card {
            max-width: 480px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="card container-card mx-auto p-4 bg-white border-0">
            <div class="card-body">
                <h3 class="card-title text-center text-primary fw-bold mb-1">
                    Candidate Verification System
                </h3>
             

                <form onsubmit="return false;">
                   
                    <div class="mb-3">
                        <label for="first-name" class="form-label fw-semibold">First Name</label>
                        <input type="text" id="first-name" class="form-control" placeholder="Enter first name" required>
                    </div>

                   
                    <div class="mb-3">
                        <label for="last-name" class="form-label fw-semibold">Last Name</label>
                        <input type="text" id="last-name" class="form-control" placeholder="Enter last name" required>
                    </div>

                    
                    <button type="button" 
                            id="check-btn" 
                            class="btn btn-primary w-100 py-2 fw-bold" 
                            py-click="check_membership">
                        Verify Membership
                    </button>
                </form>

                
                <div id="result-card" class="alert alert-secondary mt-4 text-center">
                    <span id="result-area" class="fw-semibold">
                        Enter details above and click Verify.
                    </span>
                </div>
            </div>
        </div>
    </div>

    
    <script type="py" src="./main.py"></script>

</body>
</html>
